services:
  # Modo de transição para servidores que já possuem Caddy/NGINX no host.
  # Somente loopback é publicado; nada fica exposto diretamente à LAN/Internet.
  hub-core:
    ports:
      - "${HUB_LOCAL_BIND:-127.0.0.1}:${HUB_LOCAL_PORT:-3083}:80"

  pms:
    ports:
      - "${PMS_LOCAL_BIND:-127.0.0.1}:${PMS_LOCAL_PORT:-3084}:80"

  totem-api:
    ports:
      - "${TOTEM_LOCAL_BIND:-127.0.0.1}:${TOTEM_LOCAL_PORT:-3080}:3080"

  totem-food:
    ports:
      - "${TOTEM_FOOD_LOCAL_BIND:-127.0.0.1}:${TOTEM_FOOD_LOCAL_PORT:-3085}:3088"

  # Face Scanner permanece em homologação, mas sua ponte para o Caddy do host
  # fica restrita a loopback. A comunicação Totem -> Face usa face-scanner:8091
  # diretamente na rede Docker backend.
  face-scanner:
    environment:
      APP_ENV: homologation
      FACE_VERIFICATION_PROVIDER: mock
      FACE_MOCK_STATUS: ${FACE_MOCK_STATUS:-match}
    ports:
      - "127.0.0.1:8092:8091"
